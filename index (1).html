<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Şok haber barbie tırcılık açıldı</title>
  <style>
    :root {
      --zemin: #fff0f6;
      --yazi: #3a1228;
      --soluk: #9a5b7a;
      --pembe: #e0218a;
    }
    body {
      margin: 0;
      background: var(--zemin);
      color: var(--yazi);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.7;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 18px 60px;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.15;
      margin: 0 0 10px;
      color: var(--pembe);
    }
    .yazar {
      margin: 0 0 24px;
      color: var(--soluk);
      font-style: italic;
    }
    p { font-size: 1.15rem; }
    img {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 24px;
      border-radius: 10px;
      border: 3px solid var(--pembe);
    }
  </style>
</head>
<body>
  <main>
    <h1>Şok haber barbie tırcılık açıldı</h1>
    <p class="yazar">Yazan: Dönerciler</p>
    <p>Amasrada barbie tırcılık açıldı. İlk çalışanımız olan barbaros bu fotoğrafla tarihe geçti</p>
    <img src="foto1.png" alt="Pembe Barbie tırının direksiyonunda gülümseyen genç sürücü">
  </main>
</body>
</html>
